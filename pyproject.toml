[tool.poetry]
name = "adip"
version = "0.1.0"
description = "Autoregressive Differentiable Method for Integer Programming (ADIP) — QKP experiments."
authors = ["ADIP authors"]
readme = "README.md"
packages = [{ include = "adip" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = ">=1.21,<2"
scipy = "^1.11"
torch = ">=2.0"
matplotlib = "^3.9"
scikit-learn = "^1.6"
tqdm = "^4.67"
pyscipopt = "^6.0"
highspy = "^1.8"
ortools = "^9.10"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
